<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TAG Play</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="play">
<header class="bar">
    <span class="title" id="title">Starting…</span>
    <span class="status" id="status">Connecting</span>
    <span class="spacer"></span>
    <span class="muted" id="seed"></span>
    <span class="actions">
        <button id="restart" title="Play this game again from the start, with the same seed">Restart</button>
        <button id="new-game" title="The same setup with a new seed">New game</button>
        <button id="setup" title="Back to the start page">Setup</button>
    </span>
</header>
<div class="main">
    <div class="stage" id="stage">
        <canvas id="screen" tabindex="0"></canvas>
        <div id="notice">Starting game…</div>
        <div class="toasts" id="toasts"></div>
    </div>
    <aside class="sidebar" id="sidebar" hidden>
        <section class="panel" id="actions-panel" hidden>
            <div class="panel-head">
                <h2>Your move</h2>
                <span class="muted" id="action-count"></span>
            </div>
            <input id="action-filter" type="search" placeholder="Filter actions" hidden>
            <div class="action-list" id="action-list"></div>
        </section>
        <section class="panel" id="info-panel" hidden>
            <div class="panel-head"><h2>Game</h2></div>
            <dl class="info" id="info"></dl>
        </section>
        <section class="panel grow" id="history-panel" hidden>
            <div class="panel-head"><h2>History</h2></div>
            <ol class="history" id="history"></ol>
        </section>
    </aside>
</div>
<div id="tooltip" hidden></div>

<dialog id="results">
    <h2 id="results-title">Game over</h2>
    <table class="results">
        <thead><tr><th>Place</th><th>Player</th><th class="num">Score</th></tr></thead>
        <tbody id="results-body"></tbody>
    </table>
    <div class="row">
        <button id="results-close">Look at the board</button>
        <span class="actions">
            <button id="results-restart">Restart</button>
            <button id="results-new" class="primary">New game</button>
        </span>
    </div>
</dialog>
<script src="play.js"></script>
</body>
</html>

# fly.toml app configuration file generated for tag-games on 2026-10-09T11:49:17+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'tag-games'
primary_region = 'lhr'

[build]
  dockerfile = 'Dockerfile'

[processes]
  app = 'WebServer port=8080 maxSessions=3 idleMinutes=15'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 50
    soft_limit = 20

[[vm]]
  size = 'shared-cpu-2x'
  memory = '2gb'
